name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      authoring_mode:
        description: "Explicit authoring mode for this run (code-health provenance)"
        required: false
        type: choice
        options: ["", "human", "human_assisted", "agent_supervised", "agent_autonomous", "mixed"]
      agent_name:
        description: "Agent that produced the change, if any"
        required: false
        type: string

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Reports are produced on every leg so the command stays identical
      # across the matrix -- a conditional argument string is exactly the kind
      # of thing that silently stops emitting one day. Only 3.12's are
      # published, because the code-health snapshot needs one deterministic
      # source: coverage differs between interpreters wherever a branch is
      # version-gated, so "the" coverage number has to name its interpreter.
      - name: Run tests
        run: |
          pytest --tb=short -q \
            --junitxml=reports/junit.xml \
            --cov=origo --cov-report=xml:reports/coverage.xml

      # if: always() so a failing suite still publishes its report. The
      # measurement of a failing commit is exactly as valuable as that of a
      # passing one, and losing it would leave a hole in the series.
      - name: Publish the reports the code-health lane consumes
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py312
          path: reports/
          retention-days: 7

  # Lives in this workflow, not a separate one, so it can consume the very
  # JUnit and coverage reports the gating test run produced. Reviewed point on
  # origo#97: a separate workflow could only get at them by re-running pytest,
  # which meant the snapshot described a fourth execution rather than the one
  # that actually gated the build.
  #
  # needs: [test] + if: always() -- ordered after the suite so the reports
  # exist, but still runs when the suite failed. A failing commit's structural
  # measurement is exactly as valuable as a passing one's, and skipping it
  # would leave a hole in the series precisely where the interesting commits
  # are.
  code-health:
    name: Code health
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    permissions:
      contents: read
      actions: read      # only to read the previous run's baseline artifact
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          # The merge base against the default branch is needed to describe a
          # pull request's change; a shallow clone does not contain it.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the analyzers
        # The collector core is stdlib-only; these are the tools it shells out
        # to. The package itself is installed so pyright resolves origo's
        # imports against the same dependency set the suite ran under -- an
        # unresolved import inflates the type-error count for reasons that have
        # nothing to do with the code.
        run: pip install -e ".[dev,code-health,code-health-otel]"

      - name: Fetch the reports the gating test run produced
        uses: actions/download-artifact@v4
        with:
          name: test-reports-py312
          path: reports
        # A cancelled or crashed matrix leg leaves no artifact. That is a
        # `tests: skipped` section in the snapshot, not a failed job -- the
        # structural measurement is still worth having.
        continue-on-error: true

      - name: Fetch the previous default-branch snapshot as a baseline
        id: baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          run_id="$(gh run list --workflow ci.yml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)"
          if [ -z "${run_id:-}" ] || [ "${run_id}" = "null" ]; then
            echo "no previous successful main run; deltas will be unavailable"
            exit 0
          fi
          mkdir -p baseline
          gh run download "$run_id" --name code-health-main --dir baseline \
            || echo "baseline artifact unavailable for run $run_id"

      - name: Collect, report, and export
        env:
          # Standard OpenTelemetry configuration only. The Collector decides
          # where anything goes; CI does not know the backends.
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          # Optional durable document sink, independent of the Collector. Both
          # unset by default, in which case emission is skipped. See
          # docs/code-health.md, "Why a document sink as well as OTLP".
          CODE_HEALTH_ENDPOINT: ${{ vars.CODE_HEALTH_ENDPOINT }}
          CODE_HEALTH_TOKEN: ${{ secrets.CODE_HEALTH_TOKEN }}
          CODE_HEALTH_DEFAULT_BRANCH: main
          # --- provenance: explicit metadata only, never inferred ---
          CODE_HEALTH_AUTHORING_MODE: ${{ inputs.authoring_mode }}
          CODE_HEALTH_AGENT_NAME: ${{ inputs.agent_name }}
          # Labels are trusted because applying one needs write access.
          CODE_HEALTH_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python -m tools.code_health \
            --output code-health.json \
            --junit reports/junit.xml \
            --coverage reports/coverage.xml \
            --tests-python-version 3.12 \
            --baseline baseline/code-health.json \
            --gate \
            --emit-otlp \
            --emit-http

      # Always uploaded, including when the gate failed.
      - name: Upload the canonical artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-health-${{ github.ref_name == 'main' && 'main' || format('pr-{0}', github.run_id) }}
          path: |
            code-health.json
            reports/
          retention-days: 90

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  osv-scan:
    name: OSV vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --recursive
            ./
