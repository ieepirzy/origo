[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oauth-mcp"
version = "0.1.0"
description = "Drop-in OAuth 2.1 provider for MCP servers. Works with FastMCP, FastAPI, and the raw MCP SDK."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "starlette>=0.27.0",
]

[project.optional-dependencies]
fastmcp = ["fastmcp>=2.0.0"]
fastapi = ["fastapi>=0.100.0"]
dev = ["pytest", "pytest-asyncio", "httpx"]

[project.urls]
Homepage = "https://github.com/ieepirzy/oauth-mcp"
Issues = "https://github.com/ieepirzy/oauth-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["oauth_mcp"]