[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "origo"
version = "0.3.0"
description = "Drop-in OAuth 2.1 provider for servers. Developed originally for custom/private MCP servers. Works with FastMCP, FastAPI, and the raw MCP SDK."
authors = [
  { name = "ieepirzy", email = "nervy_colder_1m@icloud.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.27.0",
    "anyio>=3.0.0",
    "python-multipart>=0.0.9",
    "cryptography>=41.0.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
# Floor verified against fastmcp source tags, not guessed: TokenVerifier
# exists from 2.11.0, but AccessToken only gained the `claims` field the
# adapter depends on in 2.12.0 (2.11.0 re-exports the mcp SDK's claims-less
# AccessToken, which would silently discard the metadata hosts use to
# distinguish origo credentials). test_fastmcp_auth.py passes against
# 2.12.0 exactly.
fastmcp = ["fastmcp>=2.12.0"]
fastapi = ["fastapi>=0.100.0"]
# fastmcp is in dev so tests/test_fastmcp_auth.py actually runs in CI —
# it importorskips, so its absence would silently skip the adapter's tests.
dev = ["pytest", "pytest-asyncio", "httpx", "pytest-cov", "fastmcp>=2.12.0"]
# The code-health collector. Split from `dev` so the analysis lane installs
# only what it needs, and so a repository adopting the collector does not
# inherit origo's test dependencies. The collector core is stdlib-only; these
# are the analyzers it shells out to.
code-health = ["radon>=6.0", "ruff>=0.5", "pyright>=1.1.400"]
# OTLP export. Optional on purpose: with these absent the collector still
# produces the canonical artifact and prints the summary, and records the
# export as skipped rather than failing.
code-health-otel = [
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.urls]
Homepage = "https://github.com/ieepirzy/origo"
Documentation = "https://github.com/ieepirzy/origo/blob/main/README.md"
Source = "https://github.com/ieepirzy/origo"
Issues = "https://github.com/ieepirzy/origo/issues"

[tool.hatch.build.targets.wheel]
packages = ["origo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.code_health]
# Complexity/LOC/maintainability are measured on the shipped package only.
# Test-suite complexity is a different quantity -- long parametrised test
# bodies are not a maintainability problem in the way a CC-34 request handler
# is -- and mixing them into one series makes both uninterpretable.
paths = ["origo"]
# Lint is measured across everything, because an unused import in a test is
# still a real finding worth trending.
lint_paths = ["origo", "tests", "tools"]
# ...but only the package and the collector are gated. As of the baseline
# commit `origo/` and `tools/` both have zero ruff findings, while `tests/`
# has 12 (7 F401, 3 F841, 2 E402) -- gating that too would fail the build on
# day one and force exactly the unrelated cleanup this lane is not supposed
# to cause. The test-suite findings are still measured and trended.
lint_gate_paths = ["origo", "tools"]
typecheck_paths = ["origo"]
# pyright over mypy: origo is a library other repositories install (mirarun
# pins origo>=0.2.1), so the errors that matter most are public-API shape
# errors in `X | None` returns and defaults -- which pyright's inference
# surfaces more of here (49 vs mypy's 36 over the same package). Recorded in
# every snapshot as typing.tool, because the two are not interchangeable.
type_checker = "pyright"
# Measured from the first run, gated only once the baseline reaches zero.
typecheck_blocking = false
hotspot_limit = 20
