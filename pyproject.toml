[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "origo"
version = "0.1.0"
description = "Drop-in OAuth 2.1 provider for MCP servers. Works with FastMCP, FastAPI, and the raw MCP SDK."
authors = [
  { name = "Ilari Pirkkalainen", email = "iladevv0@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "starlette>=0.27.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
fastmcp = ["fastmcp>=2.0.0"]
fastapi = ["fastapi>=0.100.0"]
dev = ["pytest", "pytest-asyncio", "httpx"]

[project.urls]
Homepage = "https://github.com/ieepirzy/origo"
Documentation = "https://github.com/ieepirzy/origo/blob/main/README.md"
Source = "https://github.com/ieepirzy/origo"
Issues = "https://github.com/ieepirzy/origo/issues"

[tool.hatch.build.targets.wheel]
packages = ["origo"]