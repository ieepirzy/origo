[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "origo"
version = "0.1.8"
description = "Drop-in OAuth 2.1 provider for servers. Developed originally for custom/private MCP servers. Works with FastMCP, FastAPI, and the raw MCP SDK."
authors = [
  { name = "ieepirzy", email = "nervy_colder_1m@icloud.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.27.0",
    "anyio>=3.0.0",
    "python-multipart>=0.0.9",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
fastmcp = ["fastmcp>=2.0.0"]
fastapi = ["fastapi>=0.100.0"]
dev = ["pytest", "pytest-asyncio", "httpx", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/ieepirzy/origo"
Documentation = "https://github.com/ieepirzy/origo/blob/main/README.md"
Source = "https://github.com/ieepirzy/origo"
Issues = "https://github.com/ieepirzy/origo/issues"

[tool.hatch.build.targets.wheel]
packages = ["origo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
