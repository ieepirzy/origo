[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "origo"
version = "0.3.0"
description = "Drop-in OAuth 2.1 provider for servers. Developed originally for custom/private MCP servers. Works with FastMCP, FastAPI, and the raw MCP SDK."
authors = [
  { name = "ieepirzy", email = "nervy_colder_1m@icloud.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.27.0",
    "anyio>=3.0.0",
    "python-multipart>=0.0.9",
    "cryptography>=41.0.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
# Floor verified against fastmcp source tags, not guessed: TokenVerifier
# exists from 2.11.0, but AccessToken only gained the `claims` field the
# adapter depends on in 2.12.0 (2.11.0 re-exports the mcp SDK's claims-less
# AccessToken, which would silently discard the metadata hosts use to
# distinguish origo credentials). test_fastmcp_auth.py passes against
# 2.12.0 exactly.
fastmcp = ["fastmcp>=2.12.0"]
fastapi = ["fastapi>=0.100.0"]
# fastmcp is in dev so tests/test_fastmcp_auth.py actually runs in CI —
# it importorskips, so its absence would silently skip the adapter's tests.
dev = ["pytest", "pytest-asyncio", "httpx", "pytest-cov", "fastmcp>=2.12.0"]

[project.urls]
Homepage = "https://github.com/ieepirzy/origo"
Documentation = "https://github.com/ieepirzy/origo/blob/main/README.md"
Source = "https://github.com/ieepirzy/origo"
Issues = "https://github.com/ieepirzy/origo/issues"

[tool.hatch.build.targets.wheel]
packages = ["origo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
